[project]
name = "mandate"
version = "0.1.0"
description = "Bounded authority for AI agents that negotiate on behalf of different companies, built on Switch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.7",
  "cryptography>=43",
  "reportlab>=4.2",
  "anthropic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mandate = "mandate.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandate*"]

[tool.setuptools.package-data]
mandate = ["web/*.html"]
